[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-agent-eval-lab"
version = "0.1.0"
description = "Vendor-neutral evaluation harness for enterprise AI agents"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Shabi Abbas"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
agent-eval = "agent_eval_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
